name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # py_chronolog_client is not on PyPI and is not needed here: the backend
      # probes for it at runtime and the suite runs entirely in offline mode.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Coverage flags and the failure floor live in pyproject; this only adds
      # the XML the summary step reads.
      - name: Test with coverage
        run: pytest --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              r = ET.parse("coverage.xml").getroot()
              print(f"**{float(r.get('line-rate', 0)) * 100:.1f}%** line coverage")
          except Exception as exc:
              print(f"coverage report unavailable: {exc}")
          PY

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  integration:
    name: offline smoke (installed package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Builds the SPA into the package, then installs NON-editable. This is
      # what catches packaging regressions the unit tests cannot see: if the
      # bundle stops being picked up as package-data, a wheel ships a dashboard
      # that serves no UI, and every test still passes.
      - name: Build the SPA into the package
        run: make workspace

      - name: Install the package (not editable)
        run: pip install .

      - name: Boot offline and probe the API
        env:
          CHRONOLOG_OFFLINE: "1"
          OBSERVE_HOST: "127.0.0.1"
          OBSERVE_PORT: "5000"
        run: |
          set -euo pipefail
          export DTP_STATE_DIR="$RUNNER_TEMP/state"
          export DEMO_STATE_DIR="$DTP_STATE_DIR"
          mkdir -p "$DTP_STATE_DIR"

          # Seed one demo so the tabs have something to render.
          python3 scripts/demos/demo_doctor.py > /dev/null

          chronolog-observe &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/api/config > /dev/null && break
            sleep 1
          done

          echo "--- /api/config ---"
          curl -sf http://127.0.0.1:5000/api/config | tee /tmp/config.json
          python3 -c 'import json;d=json.load(open("/tmp/config.json"));assert d["offline"] is True;assert d["capabilities"],"no capabilities"'

          # The SPA must actually be served from the installed package.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/)" = "200"

          for path in /api/scenarios /api/diagnostics/incidents /api/fleet/health /api/tracing/scenarios; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5000$path")
            echo "$path -> $code"
            test "$code" -lt 500
          done
