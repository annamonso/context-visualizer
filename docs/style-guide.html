;display:flex;flex-direction:column\">\n      <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Layered stack<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px\"><span style=\"border:1px solid #3a4050;color:#9ca3b0;font-size:11px;text-align:center;padding:9px 4px\">Monitoring<\u002Fspan><span style=\"border:1px solid #3a4050;color:#9ca3b0;font-size:11px;text-align:center;padding:9px 4px\">Analytics<\u002Fspan><span style=\"border:1px solid #3a4050;color:#9ca3b0;font-size:11px;text-align:center;padding:9px 4px\">Sensors<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px\"><span style=\"background:#c3e04d;color:#1e222b;font-size:11px;font-weight:600;text-align:center;padding:9px 4px;border-radius:6px\">Log API<\u002Fspan><span style=\"background:#c3e04d;color:#1e222b;font-size:11px;font-weight:600;text-align:center;padding:9px 4px;border-radius:6px\">Pub/Sub<\u002Fspan><span style=\"background:#c3e04d;color:#1e222b;font-size:11px;font-weight:600;text-align:center;padding:9px 4px;border-radius:6px\">MCP<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#1e222b;border:1px solid #3a4050;text-align:center;padding:14px 4px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#c3e04d;letter-spacing:-.02em\">ChronoLog<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding:0 22px 20px;font-size:13px;line-height:1.5;color:#9ca3b0\">Outlined = external, lime = ChronoLog interface, dark = the substrate. Never reorder those roles.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:22px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Nested model card<\u002Fspan>\n      <div style=\"border:1px solid #3a4050;background:#c3e04d0d;padding:22px 14px 14px;position:relative;border-radius:6px\">\n        <span style=\"position:absolute;top:0;left:14px;background:#c3e04d;color:#1e222b;border-radius:0 0 7px 7px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:600\">Chronicle<\u002Fspan>\n        <div style=\"border:1px solid #3a4050;background:#1e222b;padding:20px 12px 12px;position:relative;border-radius:6px\">\n          <span style=\"position:absolute;top:0;left:12px;background:#c3e04d;color:#1e222b;border-radius:0 0 7px 7px;padding:3px 9px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:600\">Story<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;border:1px solid #3a4050;padding:7px 10px;border-radius:4px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-style:italic;font-size:13px;color:#e4e7ed\">t₀<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3b0\">timestamp + record<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;border:1px solid #3a4050;padding:7px 10px;border-radius:4px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-style:italic;font-size:13px;color:#e4e7ed\">t₁<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3b0\">timestamp + record<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">Containment shown by nesting with a tab label, never by arrows or a legend.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:18px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Slide chrome<\u002Fspan>\n    <div style=\"position:relative;background:#1e222b;border:1px solid #3a4050;height:150px;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(58,64,80,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(58,64,80,.4) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at 50% 50%,black 0%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,black 0%,transparent 75%)\"><\u002Fdiv>\n      <div style=\"position:absolute;top:16px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:17px;height:17px;display:block;flex:0 0 auto\"><span style=\"font-size:13px;font-weight:600;color:#e4e7ed\">ChronoLog<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">weekly<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#5a6577\">2026-05-07<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:22px;bottom:38px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;color:#e4e7ed\">Slide title<\u002Fspan><\u002Fdiv>\n      <div style=\"position:absolute;left:22px;right:22px;bottom:14px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#5a6577\"><span>GNOSIS RESEARCH CENTER<\u002Fspan><span>04 / 12<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Every slide but the cover carries the same chrome: lockup top-left, date top-right, affiliation bottom-left, slide count bottom-right — all mono, all <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d4ea7a\">#5a6577<\u002Fspan>, inset 48px / 80px at 1920×1080.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 07 DIAGRAMS ============ -->\n<section id=\"diagrams\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">07<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Diagrams &amp; data<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">one visual language<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px\">\n      <svg sc-camel-view-box=\"0 0 640 240\" style=\"display:block;width:100%;height:auto\">\n        <defs><marker id=\"sg-arrow\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#9ca3b0\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n        <text x=\"0\" y=\"26\" font-family=\"JetBrains Mono, monospace\" font-size=\"11\" letter-spacing=\"2\" fill=\"#5a6577\">CLIENT<\u002Ftext>\n        <line x1=\"0\" y1=\"76\" x2=\"640\" y2=\"76\" stroke=\"#3a4050\" stroke-width=\"1\" stroke-dasharray=\"5 5\"><\u002Fline>\n        <text x=\"0\" y=\"106\" font-family=\"JetBrains Mono, monospace\" font-size=\"11\" letter-spacing=\"2\" fill=\"#5a6577\">DATA PLANE<\u002Ftext>\n        <line x1=\"0\" y1=\"170\" x2=\"640\" y2=\"170\" stroke=\"#3a4050\" stroke-width=\"1\" stroke-dasharray=\"5 5\"><\u002Fline>\n        <text x=\"0\" y=\"200\" font-family=\"JetBrains Mono, monospace\" font-size=\"11\" letter-spacing=\"2\" fill=\"#5a6577\">STORAGE<\u002Ftext>\n        <rect x=\"96\" y=\"12\" width=\"544\" height=\"46\" rx=\"6\" fill=\"#c3e04d\"><\u002Frect>\n        <text x=\"368\" y=\"41\" font-family=\"Space Grotesk, sans-serif\" font-weight=\"700\" font-size=\"17\" fill=\"#1e222b\" text-anchor=\"middle\">ChronoLog Client API<\u002Ftext>\n        <rect x=\"96\" y=\"96\" width=\"150\" height=\"52\" rx=\"6\" fill=\"#c3e04d\"><\u002Frect>\n        <text x=\"171\" y=\"128\" font-family=\"Space Grotesk, sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#1e222b\" text-anchor=\"middle\">CK<\u002Ftext>\n        <rect x=\"270\" y=\"96\" width=\"150\" height=\"52\" rx=\"6\" fill=\"#c3e04d\"><\u002Frect>\n        <text x=\"345\" y=\"128\" font-family=\"Space Grotesk, sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#1e222b\" text-anchor=\"middle\">CG<\u002Ftext>\n        <rect x=\"444\" y=\"96\" width=\"150\" height=\"52\" rx=\"6\" fill=\"#c3e04d\"><\u002Frect>\n        <text x=\"519\" y=\"128\" font-family=\"Space Grotesk, sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#1e222b\" text-anchor=\"middle\">CP<\u002Ftext>\n        <rect x=\"96\" y=\"188\" width=\"544\" height=\"46\" rx=\"6\" fill=\"#1e222b\" stroke=\"#3a4050\" stroke-width=\"1.5\"><\u002Frect>\n        <text x=\"368\" y=\"216\" font-family=\"JetBrains Mono, monospace\" font-weight=\"600\" font-size=\"12\" letter-spacing=\"3\" fill=\"#9ca3b0\" text-anchor=\"middle\">EXTERNAL STORAGE<\u002Ftext>\n        <line x1=\"171\" y1=\"58\" x2=\"171\" y2=\"94\" stroke=\"#9ca3b0\" stroke-width=\"1.6\" marker-end=\"url(#sg-arrow)\"><\u002Fline>\n        <line x1=\"246\" y1=\"122\" x2=\"268\" y2=\"122\" stroke=\"#9ca3b0\" stroke-width=\"1.6\" marker-end=\"url(#sg-arrow)\"><\u002Fline>\n        <line x1=\"345\" y1=\"148\" x2=\"345\" y2=\"186\" stroke=\"#9ca3b0\" stroke-width=\"1.6\" marker-end=\"url(#sg-arrow)\"><\u002Fline>\n        <line x1=\"519\" y1=\"186\" x2=\"519\" y2=\"150\" stroke=\"#9ca3b0\" stroke-width=\"1.6\" marker-end=\"url(#sg-arrow)\"><\u002Fline>\n      <\u002Fsvg>\n      <p style=\"margin:18px 0 0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Architecture diagrams are horizontal planes separated by dashed hairlines, labelled in mono in the left margin. ChronoLog's own services are lime boxes with dark labels; anything external is outlined or dark. Arrows are 1.6–2.2px in muted grey with a solid triangular head.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Charts<\u002Fspan>\n        <svg sc-camel-view-box=\"0 0 300 130\" style=\"display:block;width:100%;height:auto;margin-top:14px\">\n          <line x1=\"26\" y1=\"10\" x2=\"290\" y2=\"10\" stroke=\"#c3e04d\" stroke-opacity=\".12\"><\u002Fline>\n          <line x1=\"26\" y1=\"45\" x2=\"290\" y2=\"45\" stroke=\"#c3e04d\" stroke-opacity=\".12\"><\u002Fline>\n          <line x1=\"26\" y1=\"80\" x2=\"290\" y2=\"80\" stroke=\"#c3e04d\" stroke-opacity=\".12\"><\u002Fline>\n          <line x1=\"26\" y1=\"112\" x2=\"290\" y2=\"112\" stroke=\"#3a4050\"><\u002Fline>\n          <text x=\"20\" y=\"14\" font-family=\"JetBrains Mono, monospace\" font-size=\"8\" fill=\"#5a6577\" text-anchor=\"end\">60<\u002Ftext>\n          <text x=\"20\" y=\"49\" font-family=\"JetBrains Mono, monospace\" font-size=\"8\" fill=\"#5a6577\" text-anchor=\"end\">40<\u002Ftext>\n          <text x=\"20\" y=\"84\" font-family=\"JetBrains Mono, monospace\" font-size=\"8\" fill=\"#5a6577\" text-anchor=\"end\">20<\u002Ftext>\n          <polyline fill=\"none\" stroke=\"#c3e04d\" stroke-width=\"1.8\" points=\"34,96 68,58 102,72 136,34 170,44 204,26 238,38 272,18\"><\u002Fpolyline>\n          <polyline fill=\"none\" stroke=\"#5a6577\" stroke-width=\"1.8\" stroke-dasharray=\"4 4\" points=\"34,104 68,98 102,92 136,88 170,84 204,80 238,78 272,74\"><\u002Fpolyline>\n        <\u002Fsvg>\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:1.5;color:#9ca3b0\">One lime series = ChronoLog. Baselines and comparison series are muted grey, dashed. Grid at 12% lime, mono tick labels, no chart junk, no legends where a label fits on the line.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Naming in figures<\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.9;color:#9ca3b0\"><span style=\"color:#c3e04d\">CV<\u002Fspan> ChronoVisor<br><span style=\"color:#c3e04d\">CK<\u002Fspan> ChronoKeeper<br><span style=\"color:#c3e04d\">CG<\u002Fspan> ChronoGrapher<br><span style=\"color:#c3e04d\">CP<\u002Fspan> ChronoPlayer<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">Two-letter codes inside boxes, expanded once in a legend row beneath the frame. Never abbreviate in body text.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 08 VOICE ============ -->\n<section id=\"voice\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">08<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Voice &amp; copy<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">precise, unhyped<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:9px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e4e7ed\">Claim, then mechanism<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">State what the system does, then how — in the same sentence where possible. \"Guarantees ordering by physical time\" beats \"revolutionary ordering technology\".<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:9px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e4e7ed\">Numbers with units<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">TB/s, events/sec, nodes, µs. Every figure carries its unit and its scale condition. Never a bare percentage.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:9px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e4e7ed\">Sentence case<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Headings and buttons in sentence case. ALL-CAPS is reserved for mono metadata labels. No emoji, ever.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n    <div style=\"border:1px solid #c3e04d40;background:#c3e04d0d;padding:24px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Write this<\u002Fspan><ul style=\"margin:14px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:#e4e7ed;display:flex;flex-direction:column;gap:7px\"><li>A distributed shared tiered log store ordered by physical time.<\u002Fli><li>Range queries served across hot, warm, and cold tiers.<\u002Fli><li>Supported today: Claude Code via the ChronoLog MCP server.<\u002Fli><\u002Ful><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Not this<\u002Fspan><ul style=\"margin:14px 0 0;padding-left:20px;font-size:14px;line-height:1.7;color:#9ca3b0;display:flex;flex-direction:column;gap:7px\"><li>The next generation of blazing-fast log infrastructure.<\u002Fli><li>Seamlessly unlock insights at unprecedented scale.<\u002Fli><li>AI-powered memory for the agentic era 🚀<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 09 RULES ============ -->\n<section id=\"rules\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">09<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Do &amp; don't<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">the short list<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#3a4050;border:1px solid #3a4050\">\n    <div style=\"background:#1e222b;padding:28px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Do<\u002Fspan>\n      <ul style=\"margin:16px 0 0;padding-left:20px;font-size:14.5px;line-height:1.7;color:#9ca3b0;display:flex;flex-direction:column;gap:9px\">\n        <li>Start dark. Let lime be the only saturated thing on the surface.<\u002Fli>\n        <li>Label metadata in uppercase mono with wide tracking.<\u002Fli>\n        <li>Separate with 1px hairlines, not shadows or heavy borders.<\u002Fli>\n        <li>Keep hierarchy in weight and colour, not in more sizes.<\u002Fli>\n        <li>Use <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#d4ea7a\">text-wrap: pretty<\u002Fspan> on body, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#d4ea7a\">balance<\u002Fspan> on headings.<\u002Fli>\n        <li>Darken the accent to #a7c238 for accent text on paper.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:#1e222b;padding:28px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#edb200\">Don't<\u002Fspan>\n      <ul style=\"margin:16px 0 0;padding-left:20px;font-size:14.5px;line-height:1.7;color:#9ca3b0;display:flex;flex-direction:column;gap:9px\">\n        <li>Add a second brand hue, or tint lime toward green or yellow.<\u002Fli>\n        <li>Fill large screen areas with lime, or set lime body text on paper.<\u002Fli>\n        <li>Use pure white, pure black, or drop shadows for depth.<\u002Fli>\n        <li>Set Space Grotesk as running text, or Inter as a mono label.<\u002Fli>\n        <li>Use loud gradients — only the faint radial lime glow at ≤8%.<\u002Fli>\n        <li>Stack more than two motifs on one surface.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 10 REUSE ============ -->\n<section id=\"reuse\" style=\"margin-bottom:40px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">10<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Reuse &amp; tokens<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">copy · paste · build<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:36px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#c3e04d\">01<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#e4e7ed\">Point at this file<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Starting a new deck, poster, or page? Say \"use the ChronoLog style guide\" and this document is the reference — no re-deciding colour or type.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#c3e04d\">02<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#e4e7ed\">Paste the tokens<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Drop the CSS variables below into any new stylesheet, or the Tailwind block into <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d4ea7a\">@theme<\u002Fspan>. They match chronolog.dev exactly.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#c3e04d\">03<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#e4e7ed\">Hand it to a tool<\u002Fspan><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">The style brief at the bottom is written to be pasted into any AI assistant or shared with a designer as a one-paragraph spec.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showCode }}\" hint-placeholder-val=\"{{ true }}\">\n  <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">CSS custom properties<\u002Fh3>\n  <pre style=\"margin:0 0 32px;background:#171a21;border:1px solid #3a4050;padding:24px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#9ca3b0\">:root {\n  /* accent — the only saturated hue */\n  --lime:        #c3e04d;\n  --lime-light:  #d4ea7a;\n  --lime-05:     #c3e04d0d;\n  --lime-10:     #c3e04d1a;\n  --lime-20:     #c3e04d33;\n  --lime-40:     #c3e04d66;\n\n  /* dark surfaces */\n  --bg:          #1e222b;\n  --bg-alt:      #252a35;\n  --bg-card:     #2e3340;\n  --charcoal:    #2a2f3a;\n  --border:      #3a4050;\n\n  /* text */\n  --text:        #e4e7ed;\n  --text-muted:  #9ca3b0;\n  --slate-brand: #5a6577;\n\n  /* status */\n  --warn:        #edb200;\n\n  /* paper (print) */\n  --paper:       #f4f5ee;\n  --paper-2:     #e8ebdc;\n  --ink:         #0e120a;\n  --lime-print:  #c7e04a;\n  --lime-2:      #a7c238;\n  --muted-print: #6b7160;\n\n  /* storage tiers — diagrams only */\n  --hot:         #e25c3a;\n  --warm:        #e8a33a;\n  --cold:        #5bb1b7;\n\n  /* type */\n  --font-sans:    \"Inter\", system-ui, -apple-system, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  --font-display: \"Space Grotesk\", \"Inter\", sans-serif;\n}\n\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-sans);\n  font-feature-settings: \"ss01\",\"cv11\",\"tnum\";\n}<\u002Fpre>\n\n  <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Tailwind v4 theme<\u002Fh3>\n  <pre style=\"margin:0 0 32px;background:#171a21;border:1px solid #3a4050;padding:24px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#9ca3b0\">@theme {\n  --color-lime:        #c3e04d;\n  --color-lime-light:  #d4ea7a;\n  --color-bg:          #1e222b;\n  --color-bg-alt:      #252a35;\n  --color-bg-card:     #2e3340;\n  --color-charcoal:    #2a2f3a;\n  --color-slate-brand: #5a6577;\n  --color-text:        #e4e7ed;\n  --color-text-muted:  #9ca3b0;\n  --color-border:      #3a4050;\n}<\u002Fpre>\n\n  <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Google Fonts<\u002Fh3>\n  <pre style=\"margin:0 0 32px;background:#171a21;border:1px solid #3a4050;padding:24px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#9ca3b0\">&lt;link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap\" /&gt;<\u002Fpre>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showChecklist }}\" hint-placeholder-val=\"{{ true }}\">\n  <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">One-paragraph style brief<\u002Fh3>\n  <div style=\"border-left:3px solid #c3e04d;background:#252a35;padding:26px 30px;margin-bottom:36px\">\n    <p style=\"margin:0;font-size:16.5px;line-height:1.7;color:#e4e7ed;text-wrap:pretty\">ChronoLog's visual system: cool near-black surfaces (#1e222b base, #252a35 panels, #2e3340 cards) with a single chartreuse accent (#c3e04d) used sparingly — links, eyebrows, key numerals, diagram fills — roughly 90% neutral to 10% accent. Text is #e4e7ed primary, #9ca3b0 secondary, #5a6577 metadata; never pure white or black. Type is Inter for everything readable, JetBrains Mono uppercase with .14–.22em tracking for every label, number, and timestamp, and Space Grotesk for display and print headlines. Structure comes from 1px #3a4050 hairlines, a 12-column grid on a 4px spacing scale, and numbered section headers; depth never comes from shadows. Recurring motifs: concentric clock rings bleeding off dark bands, a masked 80px line grid, a lime dot with a soft halo before section labels, a 3px lime left rule on metadata blocks, and one lime underline per headline. Print inverts to a warm #f4f5ee sheet with #0e120a ink, dark header and footer bands, and the accent darkened to #a7c238 for text. Tone is technical and precise: claim then mechanism, numbers with units, sentence case, no hype, no emoji.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid #3a4050;padding-top:28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n  <div style=\"display:flex;align-items:center;gap:12px\">\n    <img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:22px;height:22px;display:block;flex:0 0 auto\">\n    <span style=\"font-size:15px;font-weight:600;color:#e4e7ed\">ChronoLog<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">style guide v1.0<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">Derived from chronolog.dev, the GCARS26 poster, and ChronoLog Weekly · Gnosis Research Center · NSF CSSI-2104013<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPrint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showCode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showChecklist&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showPrint: this.props.showPrint ?? true,\n      showCode: this.props.showCode ?? true,\n      showChecklist: this.props.showChecklist ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
