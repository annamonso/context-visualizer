    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nd: rgba(195,224,77,.25); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#1e222b;min-height:100vh;padding:0 0 120px\">\n\n<header style=\"position:relative;overflow:hidden;background:#1e222b;border-bottom:1px solid #3a4050;padding:72px 56px 56px\">\n  <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(58,64,80,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(58,64,80,.5) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse at 70% 30%,black 0%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 70% 30%,black 0%,transparent 75%);opacity:.6;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;right:-140px;top:-60px;width:520px;height:520px;border:1px solid rgba(195,224,77,.16);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;right:-60px;top:20px;width:380px;height:380px;border:1px dashed rgba(195,224,77,.2);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;right:80px;top:120px;width:180px;height:180px;border:2px solid #c3e04d;border-radius:50%;opacity:.5;pointer-events:none\"><\u002Fdiv>\n\n  <div style=\"position:relative;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;background:#c3e04d;color:#1e222b;border-radius:999px;padding:6px 13px;font-weight:600;letter-spacing:.16em\"><span style=\"width:7px;height:7px;border-radius:50%;background:#1e222b\"><\u002Fspan>v1.0<\u002Fspan>\n      <span>Brand &amp; Style Guide<\u002Fspan>\n      <span style=\"color:#9ca3b0\">chronolog.dev<\u002Fspan>\n    <\u002Fdiv>\n\n    <h1 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:104px;line-height:.92;letter-spacing:-.045em;font-weight:700;color:#e4e7ed;max-width:16ch\">Chrono<span style=\"color:#c3e04d\">Log<\u002Fspan> style system<\u002Fh1>\n\n    <p style=\"margin:0;max-width:62ch;font-size:22px;line-height:1.5;font-weight:300;color:#9ca3b0;text-wrap:pretty\">The single reference for every ChronoLog artifact — site, slides, posters, papers, docs. Copy the tokens at the <a href=\"#reuse\">end of this document<\u002Fa> into any new project and the look carries over.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:#3a4050;border:1px solid #3a4050;margin-top:12px\">\n      <div style=\"background:#1e222b;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">Accent<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#c3e04d\">#c3e04d<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#1e222b;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">Surface<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#e4e7ed\">#1e222b<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#1e222b;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">Type<\u002Fspan><span style=\"font-size:16px;color:#e4e7ed;font-weight:500\">Inter · JetBrains Mono<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#1e222b;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">Display<\u002Fspan><span style=\"font-size:16px;color:#e4e7ed;font-weight:500;font-family:'Space Grotesk',sans-serif\">Space Grotesk<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 56px\">\n\n<nav style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 32px;padding:36px 0 8px;border-bottom:1px solid #3a4050;margin-bottom:64px\">\n  <a href=\"#logo\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">01<\u002Fspan>Logo &amp; mark<\u002Fa>\n  <a href=\"#color\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">02<\u002Fspan>Color<\u002Fa>\n  <a href=\"#type\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">03<\u002Fspan>Typography<\u002Fa>\n  <a href=\"#layout\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">04<\u002Fspan>Layout &amp; grid<\u002Fa>\n  <a href=\"#motifs\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">05<\u002Fspan>Signature motifs<\u002Fa>\n  <a href=\"#components\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">06<\u002Fspan>Components<\u002Fa>\n  <a href=\"#diagrams\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">07<\u002Fspan>Diagrams &amp; data<\u002Fa>\n  <a href=\"#voice\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">08<\u002Fspan>Voice &amp; copy<\u002Fa>\n  <a href=\"#rules\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">09<\u002Fspan>Do &amp; don't<\u002Fa>\n  <a href=\"#reuse\" style=\"border:none;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#9ca3b0\"><span style=\"color:#c3e04d;margin-right:10px\">10<\u002Fspan>Reuse &amp; tokens<\u002Fa>\n<\u002Fnav>\n\n<!-- ============ 01 LOGO ============ -->\n<section id=\"logo\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">01<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Logo &amp; mark<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">wordmark · stopwatch mark<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:stretch\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:44px;display:flex;flex-direction:column;gap:24px;justify-content:center\">\n      <img src=\"e1581778-1239-43b5-9d25-e59c1c538ad1\" alt=\"ChronoLog full logo\" style=\"width:100%;max-width:620px;display:block\">\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#9ca3b0\">Full illustrated wordmark. Use on dark surfaces only, at ≥320px wide, where there is room for it to breathe — site hero, poster header, deck cover, GitHub social card.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"border:1px solid #3a4050;background:#252a35;padding:28px;display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:30px;height:30px;display:block;flex:0 0 auto\">\n          <span style=\"font-size:22px;font-weight:600;letter-spacing:-.01em;color:#e4e7ed\">ChronoLog<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6577\">weekly<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#9ca3b0\">The <strong style=\"color:#e4e7ed;font-weight:600\">chrome lockup<\u002Fstrong>: stopwatch mark + name + optional mono qualifier. This is the default in-document signature — slide corners, page headers, footers.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3a4050;background:#252a35;padding:24px 28px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c3e04d\">Rules<\u002Fspan>\n        <ul style=\"margin:0;padding-left:20px;font-size:14px;line-height:1.65;color:#9ca3b0;display:flex;flex-direction:column;gap:6px\">\n          <li>Clear space on all sides = cap-height of the wordmark.<\u002Fli>\n          <li>Never recolor the mark. Lime on dark, or ink on paper.<\u002Fli>\n          <li>Never set the name as two words, \"Chrono Log\", or all-caps in body copy.<\u002Fli>\n          <li>The mark alone (no name) is allowed only ≥16px, and only where ChronoLog is already named.<\u002Fli>\n          <li>The mark is a fixed raster asset — never redraw it as a plain circle-and-hand.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:28px;margin-top:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:30px;display:flex;flex-direction:column;gap:22px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Icon &amp; favicon — the stopwatch mark<\u002Fspan>\n      <div style=\"display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:88px;height:88px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">88 · app icon<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:64px;height:64px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">64 · avatar<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:40px;height:40px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">40 · nav<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:32px;height:32px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">32 · favicon<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:24px;height:24px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">24 · chrome<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:16px;height:16px;display:block;flex:0 0 auto\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#9ca3b0\">16 · minimum<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.55;color:#9ca3b0\">One asset serves every icon slot: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#d4ea7a\">chronolog-favicon.png<\u002Fspan> at 512px, scaled down. The stopwatch — streaked bezel, graph node above the hands, storage cylinder below — is the mark. It is never substituted with a plain ring-and-hand drawing, and never rebuilt in CSS or SVG.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase\">\n        <span style=\"border:1px solid #3a4050;color:#9ca3b0;padding:6px 11px\">favicon 32 · 16<\u002Fspan>\n        <span style=\"border:1px solid #3a4050;color:#9ca3b0;padding:6px 11px\">apple-touch 180<\u002Fspan>\n        <span style=\"border:1px solid #3a4050;color:#9ca3b0;padding:6px 11px\">og:image 1200 × 630 · full logo<\u002Fspan>\n        <span style=\"border:1px solid #c3e04d66;color:#c3e04d;padding:6px 11px\">transparent PNG only<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:30px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Clear space<\u002Fspan>\n      <div style=\"display:grid;place-items:center;padding:8px\">\n        <div style=\"border:1px dashed #c3e04d66;padding:26px;display:grid;place-items:center;position:relative\">\n          <span style=\"position:absolute;top:-9px;left:12px;background:#252a35;padding:0 6px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#c3e04d\">¼ × ICON<\u002Fspan>\n          <img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:104px;height:104px;display:block;flex:0 0 auto\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.55;color:#9ca3b0\">Keep clear space of at least one quarter of the icon's width on all four sides. Nothing — type, rule, chart, image edge — enters that box.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:30px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Placement on backgrounds<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px\">\n        <div style=\"background:#1e222b;border:1px solid #3a4050;height:104px;display:grid;place-items:center\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:56px;height:56px;display:block;flex:0 0 auto\"><\u002Fdiv>\n        <div style=\"background:#0e120a;border:1px solid #3a4050;height:104px;display:grid;place-items:center\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:56px;height:56px;display:block;flex:0 0 auto\"><\u002Fdiv>\n        <div style=\"background:#f4f5ee;border:1px solid #3a4050;height:104px;display:grid;place-items:center\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"ChronoLog stopwatch mark\" style=\"width:56px;height:56px;display:block;flex:0 0 auto\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3b0\">\n        <span>#1e222b · default<\u002Fspan>\n        <span>#0e120a · print band<\u002Fspan>\n        <span>#f4f5ee · paper, ≥40px<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.55;color:#9ca3b0\">The mark is built for dark surfaces. On paper it is allowed at 40px and above, where the outlined bezel still reads; below that, use the ink-on-paper wordmark instead. Never place it on a photo, a gradient, or a lime fill.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#edb200\">Misuse<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;flex-direction:column\">\n        <div style=\"position:relative;height:120px;display:grid;place-items:center;background:#1e222b;overflow:hidden\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"Recoloured mark\" style=\"width:62px;height:62px;display:block;filter:hue-rotate(150deg) saturate(1.6)\"><span style=\"position:absolute;top:9px;right:11px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#edb200\">NO<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 14px;font-size:12.5px;line-height:1.45;color:#9ca3b0\">Don’t recolour or re-tint the mark.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;flex-direction:column\">\n        <div style=\"position:relative;height:120px;display:grid;place-items:center;background:#1e222b;overflow:hidden\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"Stretched mark\" style=\"width:86px;height:52px;display:block\"><span style=\"position:absolute;top:9px;right:11px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#edb200\">NO<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 14px;font-size:12.5px;line-height:1.45;color:#9ca3b0\">Don’t stretch — keep it square.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;flex-direction:column\">\n        <div style=\"position:relative;height:120px;display:grid;place-items:center;background:#1e222b;overflow:hidden\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"Mark with effects\" style=\"width:62px;height:62px;display:block;transform:rotate(-16deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.9))\"><span style=\"position:absolute;top:9px;right:11px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#edb200\">NO<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 14px;font-size:12.5px;line-height:1.45;color:#9ca3b0\">Don’t rotate, shadow, or bevel it.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;flex-direction:column\">\n        <div style=\"position:relative;height:120px;display:grid;place-items:center;background:#1e222b;overflow:hidden\"><span style=\"display:grid;place-items:center;width:74px;height:74px;background:#c3e04d;border-radius:50%\"><img src=\"7457d7b8-f1bd-4504-94d5-37a60929a519\" alt=\"Mark in a lime disc\" style=\"width:52px;height:52px;display:block\"><\u002Fspan><span style=\"position:absolute;top:9px;right:11px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#edb200\">NO<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 14px;font-size:12.5px;line-height:1.45;color:#9ca3b0\">Don’t box it or set it on lime.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 02 COLOR ============ -->\n<section id=\"color\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">02<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Color<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">one accent · two surfaces<\u002Fspan>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 32px;max-width:70ch;font-size:17px;line-height:1.6;color:#9ca3b0;text-wrap:pretty\">ChronoLog is a single chartreuse accent on cool near-black. There is no secondary brand hue. Everything else is a neutral in the slate-blue family, and the accent is spent sparingly — roughly <strong style=\"color:#e4e7ed;font-weight:600\">90% neutral, 10% lime<\u002Fstrong>.<\u002Fp>\n\n  <h3 style=\"margin:0 0 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Screen palette — site, slides, UI<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;margin-bottom:44px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#c3e04d\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-lime<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#c3e04d<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Primary accent. Links, eyebrows, key numbers, pills, diagram fills.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#d4ea7a\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-lime-light<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#d4ea7a<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Hover / active state of the accent only.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#1e222b;box-shadow:inset 0 0 0 1px #3a4050\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-bg<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#1e222b<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Base surface. Every page and slide starts here.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#252a35\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-bg-alt<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#252a35<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Alternating band, inset panel, code block.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#2e3340\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-bg-card<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#2e3340<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Raised card on top of a band.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#3a4050\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-border<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#3a4050<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Hairlines, dividers, card outlines. 1px, never thicker.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#e4e7ed\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-text<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#e4e7ed<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Primary text. Not pure white — never use #fff.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#9ca3b0\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-text-muted<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#9ca3b0<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Secondary copy, captions, deck subtitles.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#5a6577\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-slate-brand<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#5a6577<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Metadata, mono micro-labels, disabled.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:82px;background:#edb200\"><\u002Fdiv><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#e4e7ed\">--color-warn<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9ca3b0\">#edb200<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Status only — blocked, at-risk, caution. Never decorative.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Accent tints<\u002Fh3>\n  <p style=\"margin:0 0 14px;max-width:70ch;font-size:15px;line-height:1.6;color:#9ca3b0\">Lime is never washed out with opacity ad hoc. Use these four fixed alphas for glows, fills and rules.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#3a4050;border:1px solid #3a4050;margin-bottom:44px\">\n    <div style=\"background:#1e222b;padding:0\"><div style=\"height:56px;background:#c3e04d0d\"><\u002Fdiv><div style=\"padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">5% · #c3e04d0d<br><span style=\"color:#9ca3b0\">grid lines, glow wash<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1e222b\"><div style=\"height:56px;background:#c3e04d1a\"><\u002Fdiv><div style=\"padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">10% · #c3e04d1a<br><span style=\"color:#9ca3b0\">tinted panel fill<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1e222b\"><div style=\"height:56px;background:#c3e04d33\"><\u002Fdiv><div style=\"padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">20% · #c3e04d33<br><span style=\"color:#9ca3b0\">chip bg, dot halo<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1e222b\"><div style=\"height:56px;background:#c3e04d66\"><\u002Fdiv><div style=\"padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">40% · #c3e04d66<br><span style=\"color:#9ca3b0\">accent hairline, focus<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showPrint }}\" hint-placeholder-val=\"{{ true }}\">\n  <h3 style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Paper palette — posters, papers, print<\u002Fh3>\n  <p style=\"margin:0 0 16px;max-width:70ch;font-size:15px;line-height:1.6;color:#9ca3b0\">Print inverts the system: warm off-white sheet, near-black ink, dark bands for header and footer. The accent shifts one step warmer and darkens for text use, because pure lime on paper is illegible.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin-bottom:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#f4f5ee\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--paper<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#f4f5ee<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Sheet<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#e8ebdc\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--paper-2<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#e8ebdc<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Image placeholder, inset<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#0e120a\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--ink<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#0e120a<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Body text, dark bands<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#c7e04a\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--lime-print<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#c7e04a<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Fills, on dark bands<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#a7c238\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--lime-2<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#a7c238<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Accent text on paper<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;overflow:hidden\"><div style=\"height:72px;background:#6b7160\"><\u002Fdiv><div style=\"padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#e4e7ed\">--muted-print<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">#6b7160<\u002Fspan><span style=\"font-size:12.5px;line-height:1.45;color:#9ca3b0\">Captions on paper<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;align-items:center;gap:14px;padding:14px 16px\"><span style=\"width:34px;height:34px;background:#e25c3a;flex:0 0 auto\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">--hot · #e25c3a<br><span style=\"color:#9ca3b0\">hot tier<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;align-items:center;gap:14px;padding:14px 16px\"><span style=\"width:34px;height:34px;background:#e8a33a;flex:0 0 auto\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">--warm · #e8a33a<br><span style=\"color:#9ca3b0\">warm tier<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;display:flex;align-items:center;gap:14px;padding:14px 16px\"><span style=\"width:34px;height:34px;background:#5bb1b7;flex:0 0 auto\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9ca3b0\">--cold · #5bb1b7<br><span style=\"color:#9ca3b0\">cold tier<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;max-width:70ch;font-size:14px;line-height:1.6;color:#9ca3b0\">Tier accents exist for one job: distinguishing hot / warm / cold storage in diagrams. They are not part of the brand palette and never appear in type, chrome, or backgrounds.<\u002Fp>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<!-- ============ 03 TYPOGRAPHY ============ -->\n<section id=\"type\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">03<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Typography<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">three faces · three scales<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:44px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em;color:#e4e7ed\">Aa<\u002Fspan>\n      <div><div style=\"font-size:18px;font-weight:600;color:#e4e7ed\">Inter<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5a6577;margin-top:4px\">300 400 500 600 700 800<\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Workhorse. All body copy, UI, slide text, and screen headlines. Tabular numerals on: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#d4ea7a\">\"ss01\",\"cv11\",\"tnum\"<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:56px;line-height:1;font-weight:500;color:#c3e04d\">Aa<\u002Fspan>\n      <div><div style=\"font-size:18px;font-weight:600;color:#e4e7ed\">JetBrains Mono<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5a6577;margin-top:4px\">400 500 600<\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">The system's voice of metadata: eyebrows, section numbers, labels, timestamps, axes, code. Always uppercase with <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#d4ea7a\">letter-spacing .14–.22em<\u002Fspan> when used as a label.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;line-height:1;font-weight:700;letter-spacing:-.04em;color:#e4e7ed\">Aa<\u002Fspan>\n      <div><div style=\"font-size:18px;font-weight:600;color:#e4e7ed\">Space Grotesk<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5a6577;margin-top:4px\">500 600 700<\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Display only — poster titles, print section headings, big pull statements. Never for running text, never below 24px.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 18px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Screen scale — web &amp; docs<\u002Fh3>\n  <div style=\"border:1px solid #3a4050;margin-bottom:44px\">\n    <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 26px;border-bottom:1px solid #3a4050\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577;width:170px;flex:0 0 auto;letter-spacing:.1em\">60 / 700 / -.035em<\u002Fspan><span style=\"font-size:60px;line-height:1;font-weight:700;letter-spacing:-.035em;color:#e4e7ed\">Page hero<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 26px;border-bottom:1px solid #3a4050\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577;width:170px;flex:0 0 auto;letter-spacing:.1em\">36 / 700 / -.025em<\u002Fspan><span style=\"font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.025em;color:#e4e7ed\">Section heading<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 26px;border-bottom:1px solid #3a4050\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577;width:170px;flex:0 0 auto;letter-spacing:.1em\">20 / 600 / -.01em<\u002Fspan><span style=\"font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em;color:#e4e7ed\">Card title<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 26px;border-bottom:1px solid #3a4050\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577;width:170px;flex:0 0 auto;letter-spacing:.1em\">17 / 400 / 1.6<\u002Fspan><span style=\"font-size:17px;line-height:1.6;font-weight:400;color:#9ca3b0\">Body copy sits at 17/1.6 in muted grey; only what matters is bright.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 26px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577;width:170px;flex:0 0 auto;letter-spacing:.1em\">11 / mono / .18em<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Eyebrow label<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n    <div>\n      <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Slide scale — 1920 × 1080<\u002Fh3>\n      <div style=\"border:1px solid #3a4050;background:#252a35;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:#9ca3b0;padding:20px 24px\">\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">hero<\u002Fspan><span>140 / 700 / -.04em<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">title<\u002Fspan><span>72 / 700 / -.025em<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">sub<\u002Fspan><span>44 / 500 / muted<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">body<\u002Fspan><span>34 / 400 / 1.4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">small<\u002Fspan><span>28 / 400 / muted<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">micro<\u002Fspan><span>24 / mono / .06em / caps<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Nothing on a slide goes below 24px. Slide padding 100px 120px 80px; chrome inset 48px / 80px.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h3 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d\">Poster scale — 24 × 36 in @ 2400 × 3600<\u002Fh3>\n      <div style=\"border:1px solid #3a4050;background:#252a35;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:#9ca3b0;padding:20px 24px\">\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">title<\u002Fspan><span>220 / Grotesk 700 / -.04em<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">deck<\u002Fspan><span>36 / Inter 300<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">section h2<\u002Fspan><span>46 / Grotesk 600<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">body<\u002Fspan><span>28 / Inter 400 / 1.5<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">section no.<\u002Fspan><span>28 / mono / .14em<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#e4e7ed\">label<\u002Fspan><span>20 / mono / .22em / caps<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Poster margins 110px; 12-column grid, 44px gutters, 32px row gap. Body never below 24px at 24 × 36 in.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 04 LAYOUT ============ -->\n<section id=\"layout\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">04<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Layout &amp; grid<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">12 columns · 4px base<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Spacing<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end\">\n        <div style=\"height:8px;background:#3a4050\"><\u002Fdiv><div style=\"height:12px;background:#3a4050\"><\u002Fdiv><div style=\"height:16px;background:#3a4050\"><\u002Fdiv><div style=\"height:24px;background:#3a4050\"><\u002Fdiv><div style=\"height:32px;background:#3a4050\"><\u002Fdiv><div style=\"height:48px;background:#c3e04d33\"><\u002Fdiv><div style=\"height:64px;background:#c3e04d33\"><\u002Fdiv><div style=\"height:88px;background:#c3e04d\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">4px base unit. Use 8 · 12 · 16 · 24 · 32 · 48 · 64 · 88 and nothing between. Section rhythm on screen: 96px between major sections, 36px heading-to-content.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Column grid<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:88px\">\n        <span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#c3e04d1a;border-top:2px solid #c3e04d\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan><span style=\"background:#3a405080;border-top:2px solid #3a4050\"><\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Everything sits on 12 columns. Halves (1–6 / 7–12) are the default; thirds for sidebars; full-bleed strips for use-case rows. Content max-width 1180px on the web.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid #3a4050;overflow:hidden\">\n    <div style=\"background:#1e222b;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3a4050\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Structural pattern · the dark band<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a6577\">header · body · footer<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.4fr\">\n      <div style=\"padding:26px;font-size:13.5px;line-height:1.6;color:#9ca3b0;border-right:1px solid #3a4050\">Long-form artifacts — posters, papers, one-pagers — are built as three bands: a dark ink header carrying the title and affiliations, a light body carrying the content grid, and a dark ink footer carrying references, funders, and the QR. On screen the same rhythm becomes base surface → panel → base surface.\n      <p style=\"margin:14px 0 0;color:#9ca3b0\">Grid pattern and concentric rings appear on dark bands only.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:26px;background:#252a35\">\n        <div style=\"border:1px solid #3a4050\">\n          <div style=\"position:relative;background:#0e120a;height:74px;padding:14px 16px;overflow:hidden\"><div style=\"position:absolute;inset:0;background-image:linear-gradient(to right,rgba(199,224,74,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(199,224,74,.08) 1px,transparent 1px);background-size:16px 16px\"><\u002Fdiv><div style=\"position:absolute;right:-18px;top:-18px;width:74px;height:74px;border:1px solid rgba(199,224,74,.28);border-radius:50%\"><\u002Fdiv><span style=\"position:relative;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.03em;color:#f4f5ee\">Chrono<span style=\"color:#c7e04a\">Log<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"background:#f4f5ee;height:132px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px\"><div style=\"border-top:1px solid #0e120a;padding-top:8px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#6b7160\">01 ABSTRACT<\u002Fdiv><div style=\"border-top:1px solid #0e120a;padding-top:8px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;color:#6b7160\">04 ARCHITECTURE<\u002Fdiv><div style=\"background:#e8ebdc;border:1px dashed #a7c238\"><\u002Fdiv><div style=\"background:#c7e04a\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#0e120a;height:44px;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;color:#c7e04a\">REFERENCES · FUNDERS · CHRONOLOG.DEV<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 05 MOTIFS ============ -->\n<section id=\"motifs\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">05<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Signature motifs<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">time, drawn as geometry<\u002Fspan>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 28px;max-width:70ch;font-size:17px;line-height:1.6;color:#9ca3b0;text-wrap:pretty\">Five recurring devices carry the brand without a single illustration. Use at most two on any one surface.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"position:relative;height:150px;overflow:hidden;background:#1e222b\"><div style=\"position:absolute;right:-40px;top:16px;width:170px;height:170px;border:1px solid rgba(195,224,77,.18);border-radius:50%\"><\u002Fdiv><div style=\"position:absolute;right:-10px;top:44px;width:120px;height:120px;border:1px dashed rgba(195,224,77,.24);border-radius:50%\"><\u002Fdiv><div style=\"position:absolute;right:36px;top:74px;width:60px;height:60px;border:2px solid #c3e04d;border-radius:50%\"><\u002Fdiv><div style=\"position:absolute;right:64px;top:60px;width:3px;height:34px;background:#c3e04d;transform-origin:bottom center;transform:rotate(38deg)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Concentric clock rings<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">Solid + dashed + solid, bleeding off the corner, with one tick hand. Header and footer of dark bands. Opacity .16–.24 except the small solid ring.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"position:relative;height:150px;overflow:hidden;background:#1e222b\"><div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(58,64,80,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(58,64,80,.6) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(ellipse at 50% 50%,black 0%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,black 0%,transparent 78%)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Masked line grid<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">80px grid on slides, 60px on poster bands, always faded out with a radial mask. Border colour on dark surfaces, 6% lime on ink.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"height:150px;background:#1e222b;display:flex;align-items:center;justify-content:center\"><span style=\"display:inline-flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d;font-weight:600\"><span style=\"width:10px;height:10px;border-radius:50%;background:#c3e04d;box-shadow:0 0 0 6px #c3e04d33\"><\u002Fspan>Eyebrow<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Haloed dot<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">10px lime dot with a 6px 20%-lime halo, ahead of every section eyebrow. The system's bullet.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"height:150px;background:#1e222b;display:flex;align-items:center;padding:0 26px\"><div style=\"border-left:3px solid #c3e04d;padding-left:16px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c3e04d;margin-bottom:7px\">Institutions<\u002Fdiv><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;line-height:1.3\">Gnosis Research Center<br><span style=\"font-weight:400;font-size:13px;color:#9ca3b0\">Lead institution<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Lime rule block<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">3px lime left border + 16–18px inset. Wraps every metadata block: authors, institutions, funders, references.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"position:relative;height:150px;background:#f4f5ee;overflow:hidden\"><div style=\"position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(14,18,10,.16) 1px,transparent 1.5px);background-size:12px 12px\"><\u002Fdiv><span style=\"position:absolute;top:14px;left:14px;width:20px;height:2px;background:#c7e04a\"><\u002Fspan><span style=\"position:absolute;top:14px;left:14px;width:2px;height:20px;background:#c7e04a\"><\u002Fspan><span style=\"position:absolute;bottom:14px;right:14px;width:20px;height:2px;background:#c7e04a\"><\u002Fspan><span style=\"position:absolute;bottom:14px;right:14px;width:2px;height:20px;background:#c7e04a\"><\u002Fspan><span style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#6b7160\">PRINT ONLY<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Dot field + registration marks<\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">24px dot field at 7% ink over the paper body, and 28px lime corner marks. Print artifacts only — never on screen.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35\">\n      <div style=\"height:150px;background:#1e222b;display:flex;align-items:center;justify-content:center;padding:0 22px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:#e4e7ed;line-height:1.3;text-align:center\">Ordered by <span style=\"color:#d4ea7a;border-bottom:3px solid #c3e04d;padding-bottom:2px\">physical time<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px 18px\"><div style=\"font-size:15px;font-weight:600;color:#e4e7ed;margin-bottom:5px\">Lime underline\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#9ca3b0\">A 3px lime underline under the one phrase that matters in a headline. One per surface, never two.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ============ 06 COMPONENTS ============ -->\n<section id=\"components\" style=\"margin-bottom:96px\">\n  <div style=\"display:flex;align-items:baseline;gap:22px;border-bottom:1px solid #3a4050;padding-bottom:14px;margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#c3e04d\">06<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:600;letter-spacing:-.025em;color:#e4e7ed\">Components<\u002Fh2>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577\">reusable parts<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px\">\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Numbered section header<\u002Fspan>\n      <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #3a4050;padding-bottom:12px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.18em;color:#c3e04d\">04<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-.02em;color:#e4e7ed\">Architecture<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Zero-padded mono number, display heading, 1px rule beneath. Every long-form artifact numbers its sections; slides do not.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:26px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a6577\">Pills &amp; tag chips<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px;background:#c3e04d;color:#1e222b;border-radius:999px;padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\"><span style=\"width:7px;height:7px;border-radius:50%;background:#1e222b\"><\u002Fspan>GCARS · 2026<\u002Fspan>\n        <span style=\"border:1px solid #c3e04d66;color:#c3e04d;border-radius:999px;padding:6px 13px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">Range queries<\u002Fspan>\n        <span style=\"border:1px solid #3a4050;color:#9ca3b0;border-radius:999px;padding:6px 13px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">Agent memory<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#9ca3b0\">Filled lime pill = the one primary marker per surface (event, release, status). Outlined chips = attributes; at most one is lime. Square corners on print, pill corners on screen.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:24px\">\n    <div style=\"border:1px solid #3a4050;background:#1e222b;padding:28px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden\">\n      <div style=\"position:absolute;right:-50px;top:-50px;width:170px;height:170px;border:1px solid rgba(195,224,77,.2);border-radius:50%\"><\u002Fdiv>\n      <span style=\"position:relative;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c3e04d\">Throughput<\u002Fspan>\n      <div style=\"position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:14px;border-top:1px solid #c3e04d40\">\n        <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;color:#c3e04d\">4.2M<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3b0;margin-top:5px\">events/sec<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;color:#c3e04d\">64<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3b0;margin-top:5px\">nodes<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;position:relative;font-size:13px;line-height:1.5;color:#9ca3b0\">Stat card — lime label, display numerals in lime, mono unit beneath, hairline above.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3a4050;background:#252a35;padding:0
