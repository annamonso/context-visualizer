# Local offline/demo deployment of the ChronoLog Observability dashboard.
#
# The build context is the repo root, so run this from the repo root — most
# easily via the Makefile wrappers:
#   make demo                      # build + run, seeds demo data on first boot
#   open http://localhost:5000
# ...or directly:
#   docker compose -f docker/docker-compose.yml up --build
#
# No ChronoLog cluster, no API keys, no cost. The demo data (Doctor / Fleet /
# Tracing scenarios) is seeded into the named `chronolog-data` volume on first
# boot and persists across restarts. To reseed from scratch:
#   make demo-reseed
#
# The published host port defaults to 5000; override it when 5000 is taken:
#   DASHBOARD_PORT=5055 make demo      # -> http://localhost:5055
services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chronolog-observability:offline
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    environment:
      CHRONOLOG_OFFLINE: "1"
      DTP_STATE_DIR: /data
      DEMO_STATE_DIR: /data
      SEED_DEMO: "1"        # set to 0 to skip demo seeding and start empty
    volumes:
      - chronolog-data:/data
    restart: unless-stopped

volumes:
  chronolog-data:
