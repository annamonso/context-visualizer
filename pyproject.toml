[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolog-observability"
version = "0.1.0"
description = "Drop-in observability dashboard and trace-capture for ChronoLog deployments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "pyyaml",
    "msgpack",
]

# ChronoLog's Python client (`py_chronolog_client`) is NOT on PyPI — it is built
# from the ChronoLog C++ source tree and placed on PYTHONPATH by the deployment.
# We therefore do not list it as a hard dependency; instead the backend probes
# for it at runtime and fails with a clear message if it is missing.
[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
chronolog-observe = "backend.app:main"
chronolog-capture = "backend.capture.sync_worker:main"
chronolog-collector = "backend.collector.__main__:main"
chronolog-doctor = "backend.diagnostics.worker:main"
chronolog-fleet-rollup = "backend.fleet.worker:main"

# Adapters are discovered via this entry-point group. Third parties can ship
# their own data source as a separate distribution by registering here.
[project.entry-points."backend.adapters"]
chronolog = "backend.adapters.chronolog_source:ChronoLogAdapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["templates/*.html", "static/**/*"]
