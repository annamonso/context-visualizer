[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolog-observability"
version = "0.1.0"
description = "Drop-in observability dashboard and trace-capture for ChronoLog deployments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anna Monsó" }]
keywords = ["observability", "llm", "multi-agent", "distributed-tracing", "chronolog", "hpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "flask>=2.0",
    "pyyaml",
    "msgpack",
]

# ChronoLog's Python client (`py_chronolog_client`) is NOT on PyPI — it is built
# from the ChronoLog C++ source tree and placed on PYTHONPATH by the deployment.
# We therefore do not list it as a hard dependency; instead the backend probes
# for it at runtime and fails with a clear message if it is missing.
[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
chronolog-observe = "chronolog_observability.app:main"
chronolog-capture = "chronolog_observability.capture.sync_worker:main"
chronolog-collector = "chronolog_observability.collector.__main__:main"
chronolog-doctor = "chronolog_observability.diagnostics.worker:main"
chronolog-fleet-rollup = "chronolog_observability.fleet.worker:main"

# Adapters are discovered via this entry-point group. Third parties can ship
# their own data source as a separate distribution by registering here.
[project.entry-points."chronolog_observability.adapters"]
chronolog = "chronolog_observability.adapters.chronolog_source:ChronoLogAdapter"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronolog_observability*"]

[tool.setuptools.package-data]
chronolog_observability = ["templates/*.html", "static/**/*"]

# ---------------------------------------------------------------------------
# Lint. The selected rules are the ones that catch real defects: undefined or
# unused names, syntax-level errors, and pycodestyle warnings. Stylistic and
# modernisation families (I, UP, B) are deliberately NOT enabled yet — turning
# them on rewrites several hundred lines across the tree, which is a separate
# change from making the repo publishable.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "**/_imported"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]   # long lines are pervasive in docstrings/tables; not worth churning
